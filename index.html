<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трансляция матча Реал Мадрид — Манчестер Сити</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #050814;
            color: #fff;
        }

        a { text-decoration: none; }

        .top-bar {
            width: 100%;
            background: linear-gradient(90deg, #111, #1b1b1b);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f9b52b;
        }
        .top-bar-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .top-bar-title {
            font-size: 18px;
            font-weight: 700;
            color: #f9b52b;
        }
        .top-bar-link {
            font-size: 14px;
            color: #ddd;
        }
        .melbet-btn {
            background: #f9b52b;
            color: #111;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
        }

        .page-wrapper {
            padding: 20px;
        }

        .support-top-btn-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        .support-top-btn {
            display: inline-block;
            background: linear-gradient(90deg, #ff7a00, #ffcc00);
            color: #111;
            padding: 14px 40px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(255, 180, 0, 0.6);
        }

        .main-block {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
        }

        .video-wrapper {
            position: relative;
            flex: 1 1 auto;
            max-width: 1200px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            border: 2px solid #222;
            padding-top: 56.25%; /* 16:9 */
        }
        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-overlay-blocker {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            z-index: 5;
        }

        .side-panel {
            width: 220px;
            min-width: 200px;
            background: radial-gradient(circle at top, #262626, #111);
            border-radius: 10px;
            padding: 16px;
            border: 2px solid #ffb300;
            box-shadow: 0 0 18px rgba(255, 179, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            flex-shrink: 0;
        }
        .side-title {
            text-transform: uppercase;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            color: #ffde59;
        }
        .side-subtitle {
            font-size: 12px;
            text-align: center;
            color: #ccc;
        }
        .qr-box {
            width: 6cm;
            height: 6cm;
            max-width: 210px;
            max-height: 210px;
            background: #fff;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .side-btn {
            display: inline-block;
            margin-top: 4px;
            background: linear-gradient(90deg, #ff7a00, #ffcc00);
            color: #111;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .main-block {
                flex-direction: column;
                align-items: stretch;
            }
            .side-panel {
                width: 100%;
                max-width: 360px;
                margin: 0 auto;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .page-wrapper {
                padding: 12px;
            }
            .support-top-btn {
                width: 100%;
                max-width: 320px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="top-bar-left">
        <div class="top-bar-title">Melbet</div>
        <a href="#" class="top-bar-link">Лучшая линия на матч</a>
    </div>
    <a href="https://clck.ru/3Mo7a2" class="melbet-btn">Перейти</a>
</div>

<div class="page-wrapper">

    </div>

    <div class="main-block">
        <div class="video-wrapper">
            <!-- ТВОЙ СТРИМ -->
            <iframe src="https://playball10.com/p2p-reserv/10tka9.php"
                    allowfullscreen

            </iframe>

            <!-- Если нужно блокировать клики – оставь; если нет, удали этот div -->
            <!-- <div class="video-overlay-blocker"></div> -->

            </div>
            <a href="https://yapx.ru/album/cUBfG" class="side-btn" target="_blank" rel="noopener">
                Поддержать автора
            </a>
        </div>
    </div>
</div>
</body>
</html>
